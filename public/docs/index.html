<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchVaga API — Swagger UI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/vendor/swagger-ui/favicon-32x32.png">
  <link rel="stylesheet" href="/vendor/swagger-ui/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="/vendor/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="/vendor/swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      // A mesma página serve em duas origens: swagger.kubezen.com (spec em
      // /openapi.yaml) e /docs no host da aplicação (spec em /docs/openapi.yaml).
      var specUrl = window.location.pathname.startsWith("/docs") ? "/docs/openapi.yaml" : "/openapi.yaml";
      window.ui = SwaggerUIBundle({
        url: specUrl,
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayOperationId: false,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
        tryItOutEnabled: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        persistAuthorization: false
      });
    };
  </script>
</body>
</html>
